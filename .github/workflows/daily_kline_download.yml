name: 📊 每日自选股 K 线数据自动下载

on:
  # 每日定时触发：周一至周五 美东时间 16:30 (即 UTC 20:30 / 北京时间次日凌晨 04:30)
  schedule:
    - cron: '30 20 * * 1-5'

  # 支持在 GitHub Actions 页面随时手动点击 "Run workflow" 立即触发
  workflow_dispatch:
    inputs:
      custom_tickers:
        description: '可选：临时指定抓取的股票代码 (留空则默认读取 watchlist_config.json)'
        required: false
        default: ''

jobs:
  download-and-commit:
    name: 抓取多周期 K 线并提交推送
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行多周期数据抓取 (写入 kline_data/{ticker}/{interval}_kline.csv)
        run: |
          if [ -n "${{ github.event.inputs.custom_tickers }}" ]; then
            echo "🚀 运行临时指定标的模式: ${{ github.event.inputs.custom_tickers }}"
            python fetch_data.py --tickers "${{ github.event.inputs.custom_tickers }}"
          else
            echo "🚀 运行自选股监控配置模式 (watchlist_config.json)"
            python fetch_data.py --config watchlist_config.json
          fi

      - name: 自动提交并推送数据至 GitHub 仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kline_data/
          if git diff --staged --quiet; then
            echo "ℹ️ 数据无变更，跳过提交。"
          else
            git commit -m "📊 update kline data: $(date '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

      - name: 附加备份：打包上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: kline-data-daily-${{ github.run_number }}
          path: kline_data/
          retention-days: 30
          if-no-files-found: ignore
